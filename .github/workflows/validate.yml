name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Agent Plugins manifests are current
        run: node scripts/agent-plugins.mjs --check
      - name: Get the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate each plugin
        run: |
          for p in plugins/*/; do
            claude plugin validate --strict "$p"
          done
